name: Publish OKF ONS demonstrator

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check -e ".[test]"

      - name: Run tests
        run: python -m pytest -q

      - name: Run static checks
        run: python -m ruff check .

      - name: Verify pinned ELS metadata projection
        run: |
          python scripts/project_els_snapshot.py \
            --submodule-dir vendor/explore-local-statistics-app \
            --output "$RUNNER_TEMP/ons-explore-local-statistics.json"
          cmp \
            "$RUNNER_TEMP/ons-explore-local-statistics.json" \
            source/demo-snapshot/ons-explore-local-statistics.json

      - name: Build exact bundle once from the frozen source snapshot
        run: python scripts/build_bundle.py --snapshot-dir source/demo-snapshot --output bundle

      - name: Add project-relative Pages assets to the public bundle
        run: |
          cp -R pages/. bundle/
          cp docs/demo-guide.md bundle/demo-guide.md
          cp accessibility.md bundle/accessibility.md
          touch bundle/.nojekyll

      - name: Validate assembled OKF v0.2 Markdown layer
        run: python scripts/check_okf_v02.py bundle

      - name: Verify public entrypoints
        run: |
          test -f bundle/index.html
          test -f bundle/index.md
          test -f bundle/concepts/catalogue.md
          test -f bundle/okf-explorer.json
          test -f bundle/data/demo/contrast-records.json
          test -f bundle/data/coverage/ledger.json
          test -f bundle/data/governance/context-set.json
          test -f bundle/data/governance/release.json
          test -f bundle/data/standards/evaluation.json
          test -f bundle/data/standards/okf-v0.2.json
          test -f bundle/data/evaluation/report.json
          test -f bundle/data/ons/mcp-bindings.json
          test -f bundle/data/ons/spatial-index.json
          test -f bundle/data/providers/manifest.json
          test -f bundle/data/providers/ons-explore-local-statistics.json

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: bundle
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
