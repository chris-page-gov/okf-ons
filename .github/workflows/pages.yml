name: Publish OKF ONS demonstrator

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned uv bootstrap
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/uv-0.13.4-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/astral-sh/uv/releases/download/0.13.4/uv-x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          echo "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f  $archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/uv-bin"
          tar -xzf "$archive" --directory "$RUNNER_TEMP/uv-bin" --strip-components=1
          echo "$RUNNER_TEMP/uv-bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/uv-bin/uv" --version)" = "uv 0.13.4 (7456b60bc 2026-10-20 x86_64-unknown-linux-gnu)"

      - name: Synchronise locked validation environment
        run: uv sync --locked --extra test

      - name: Run tests
        run: .venv/bin/python -m pytest -q

      - name: Run static checks
        run: .venv/bin/python -m ruff check .

      - name: Verify pinned ELS metadata projection
        run: |
          .venv/bin/python scripts/project_els_snapshot.py \
            --submodule-dir vendor/explore-local-statistics-app \
            --output "$RUNNER_TEMP/ons-explore-local-statistics.json"
          cmp \
            "$RUNNER_TEMP/ons-explore-local-statistics.json" \
            source/demo-snapshot/ons-explore-local-statistics.json

      - name: Build exact bundle once from the frozen source snapshot
        run: .venv/bin/python scripts/build_bundle.py --snapshot-dir source/demo-snapshot --output bundle

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"

      - name: Install the exact pnpm version without package scripts
        run: npm install --global --ignore-scripts --no-audit --no-fund pnpm@10.34.7

      - name: Verify every generated bundle file over loopback HTTP
        run: node scripts/check_reader_http_access.mjs --bundle bundle --output "$RUNNER_TEMP/client-access.json"

      - name: Check out the verified Explorer consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: chris-page-gov/okf-explorer
          ref: cce6e68d95c2946bb425effbaab48fbf04281a09
          path: .acceptance-tools/okf-explorer
          persist-credentials: false

      - name: Install the frozen Explorer Python environment
        working-directory: .acceptance-tools/okf-explorer
        run: uv sync --locked

      - name: Import every core source with the independent Reader
        working-directory: .acceptance-tools/okf-explorer
        run: >-
          uv run --locked python scripts/check_okf_03_source.py
          "$GITHUB_WORKSPACE/bundle" --require-0.3
          --output "$RUNNER_TEMP/source-check.json"
          --projection "$RUNNER_TEMP/source-projection.json"

      - name: Reconcile full frontmatter, bodies, source bytes and core graph
        run: .venv/bin/python scripts/check_core_projection.py "$RUNNER_TEMP/source-projection.json" --output "$RUNNER_TEMP/core-parity.json"

      - name: Install the frozen Explorer dependencies
        run: pnpm --dir .acceptance-tools/okf-explorer/apps/okf-explorer install --frozen-lockfile

      - name: Install the runner's pinned Chromium
        timeout-minutes: 5
        run: pnpm --dir .acceptance-tools/okf-explorer/apps/okf-explorer exec playwright install chromium

      - name: Replay all five metadata-backed ONS Reader journeys
        run: >-
          pnpm --dir .acceptance-tools/okf-explorer/apps/okf-explorer acceptance:bundle --
          --bundle-root "$GITHUB_WORKSPACE/bundle"
          --journeys "$GITHUB_WORKSPACE/evaluation/okf-03/ons-population-by-age-explorer-journeys.json"
          --output "$RUNNER_TEMP/explorer-acceptance.json" --port 4182

      - name: Replay the core-only conformance question in its own Reader
        run: >-
          pnpm --dir .acceptance-tools/okf-explorer/apps/okf-explorer acceptance:bundle --
          --bundle-root "$GITHUB_WORKSPACE/bundle"
          --journeys "$GITHUB_WORKSPACE/evaluation/okf-03/ons-core-walkthrough-explorer-journeys.json"
          --output "$RUNNER_TEMP/core-walkthrough-explorer-acceptance.json" --port 4183

      - name: Retain exact consumer receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: consumer-acceptance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/source-check.json
            ${{ runner.temp }}/core-parity.json
            ${{ runner.temp }}/client-access.json
            ${{ runner.temp }}/explorer-acceptance.json
            ${{ runner.temp }}/core-walkthrough-explorer-acceptance.json
          if-no-files-found: ignore

      - name: Validate assembled OKF 0.3 Markdown layer
        run: .venv/bin/python scripts/check_okf_v03.py bundle

      - name: Verify public entrypoints
        run: |
          test -f bundle/index.html
          test -f bundle/walkthrough.html
          test -f bundle/ons-population-by-age-walkthrough.svg
          test -f bundle/ons-population-by-age-source-trail.json
          test -f bundle/core-walkthrough.html
          test -f bundle/ons-core-walkthrough.svg
          test -f bundle/ons-core-walkthrough-mobile.svg
          test -f bundle/ons-core-walkthrough-evidence.json
          test -f bundle/index.md
          test -f bundle/concepts/catalogue.md
          test -f bundle/okf-core-explorer.json
          test -f bundle/okf-explorer.json
          test -f bundle/data/demo/contrast-records.json
          test -f bundle/data/coverage/ledger.json
          test -f bundle/data/governance/context-set.json
          test -f bundle/data/governance/release.json
          test -f bundle/data/standards/evaluation.json
          test -f bundle/data/standards/okf-v0.3.json
          test -f bundle/data/evaluation/report.json
          test -f bundle/data/ons/mcp-bindings.json
          test -f bundle/data/ons/spatial-index.json
          test -f bundle/data/providers/manifest.json
          test -f bundle/data/providers/ons-explore-local-statistics.json
          test -f bundle/data/semantic/validation.json

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: bundle
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
